version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: pocketprint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pocketprint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pocketprint_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-pocketprint_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pocketprint} -d ${POSTGRES_DB:-pocketprint_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cloud Relay Backend & WebSocket Hub
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pocketprint-relay
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-pocketprint}:${POSTGRES_PASSWORD:-pocketprint_secret_2026}@postgres:5432/${POSTGRES_DB:-pocketprint_db}
      JWT_SECRET: ${JWT_SECRET:-pocketprint-production-jwt-super-secret-key-32chars}
      RELAY_PUBLIC_URL: ${RELAY_PUBLIC_URL:-http://localhost:5000}
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_data:/app

  # Web Dashboard (Vite / Nginx)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: pocketprint-web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_SOCKET_URL: http://localhost:5000
    ports:
      - "5173:80"

volumes:
  postgres_data:
  backend_uploads:
  backend_data:
