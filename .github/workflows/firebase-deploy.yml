name: Firebase Security Rules & Indexes Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'database.rules.json'
      - 'storage.rules'
  workflow_dispatch:

jobs:
  deploy-firebase-rules:
    name: Validate and Deploy Firebase Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firebase Rules and Indexes
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Deploying Firebase rules using service account..."
            echo "$FIREBASE_SERVICE_ACCOUNT" > sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=sa.json
            npx firebase-tools deploy --only firestore:rules,firestore:indexes,database,storage --non-interactive
            rm -f sa.json
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "Deploying Firebase rules using FIREBASE_TOKEN..."
            npx firebase-tools deploy --only firestore:rules,firestore:indexes,database,storage --token "$FIREBASE_TOKEN" --non-interactive
          else
            echo "::notice ::No FIREBASE_TOKEN or FIREBASE_SERVICE_ACCOUNT secret configured in GitHub Secrets. Rules validated locally in CI; skipping cloud deployment."
          fi
